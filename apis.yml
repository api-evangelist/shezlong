name: Shezlong
description: >-
  Shezlong is an online mental health and therapy platform serving Egypt and the
  wider MENA region, connecting users with licensed psychologists and therapists
  through confidential video, voice, and text sessions delivered from any device.
  Founded in 2015 and Arabic-first, the consumer service offers subscription-based
  access to counseling, self-assessment tools, and educational content. It was
  surfaced as a portfolio company of 500 Global and added to the API Evangelist
  network. As of this enrichment pass Shezlong operates a client-side (Angular)
  web application behind Cloudflare and publishes no public developer API, OpenAPI
  definition, SDK, or /.well-known discovery surface; the profile is maintained as
  a lead for discovery and future enrichment.
